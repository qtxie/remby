name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: remby-linux-x86_64
            builder: cargo
            rustflags: -C target-feature=+crt-static
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: remby-linux-arm64
            # cross supplies the musl toolchain from its own image: the public
            # musl.cc tarballs are unreachable from GitHub runners.
            builder: cross
            rustflags: -C target-feature=+crt-static
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: remby-windows-x86_64.exe
            builder: cargo
            rustflags: -C target-feature=+crt-static
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: remby-windows-arm64.exe
            builder: cargo
            rustflags: -C target-feature=+crt-static
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: remby-macos-arm64
            builder: cargo

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64)
        if: matrix.builder == 'cross'
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/cross.tar.gz" \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz
          tar -xf "$RUNNER_TEMP/cross.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: ${{ matrix.builder }} build --release --target ${{ matrix.target }}

      - name: Verify static linking (Linux)
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          file "target/${{ matrix.target }}/release/remby"
          file "target/${{ matrix.target }}/release/remby" | grep -qi static

      - name: Rename artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/remby target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: Rename-Item -Path "target/${{ matrix.target }}/release/remby.exe" -NewName "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            remby-linux-x86_64
            remby-linux-arm64
            remby-windows-x86_64.exe
            remby-windows-arm64.exe
            remby-macos-arm64
          generate_release_notes: true
